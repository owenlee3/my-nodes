# node-sub: every 6 hours, fetch free nodes -> TCP test -> regenerate
# output/clash.yaml and output/shadowrocket.txt, commit back to this repo.
# Runs on GitHub's own runners; pushes with the built-in GITHUB_TOKEN,
# so no personal token is needed after the initial setup.
name: Update nodes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run pipeline
        run: python3 pipeline.py

      - name: Record run timestamp
        # Always changes, so every run commits: keeps the scheduled
        # workflow alive (GitHub disables schedules after 60 days
        # without repository activity).
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > output/last_run.txt

      - name: Commit and push
        run: |
          git config user.name "node-sub bot"
          git config user.email "node-sub-bot@users.noreply.github.com"
          git add output/
          git commit -m "update nodes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
